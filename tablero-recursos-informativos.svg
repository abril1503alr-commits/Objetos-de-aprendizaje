<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF5FF"/>
      <stop offset="100%" stop-color="#FDFEFF"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9F1FF"/>
      <stop offset="100%" stop-color="#DCEAFF"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B2A4A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Fondo del tablero -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#bg)"/>
  <!-- Textura sutil tipo pegboard -->
  <g fill="#2F6FED" opacity="0.05">
    <circle cx="60" cy="60" r="4"/><circle cx="60" cy="120" r="4"/><circle cx="60" cy="180" r="4"/>
    <circle cx="1540" cy="60" r="4"/><circle cx="1540" cy="120" r="4"/><circle cx="1540" cy="180" r="4"/>
    <circle cx="60" cy="820" r="4"/><circle cx="60" cy="880" r="4"/><circle cx="60" cy="940" r="4"/>
    <circle cx="1540" cy="820" r="4"/><circle cx="1540" cy="880" r="4"/><circle cx="1540" cy="940" r="4"/>
  </g>

  <!-- Encabezado -->
  <text x="800" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#2F6FED">CAJA DE HERRAMIENTAS</text>
  <text x="800" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1F2430">Recursos informativos: elige el recurso adecuado</text>

  <!-- ══════════ CARD 1 · Video explicativo (x=110,y=140) ══════════ -->
  <g filter="url(#cardShadow)">
    <rect x="110" y="140" width="420" height="340" rx="18" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="2"/>
  </g>
  <circle cx="320" cy="270" r="60" fill="url(#iconBg)"/>
  <!-- icono cámara/play -->
  <rect x="288" y="248" width="64" height="44" rx="8" fill="#2F6FED"/>
  <rect x="278" y="258" width="18" height="24" rx="4" fill="#2F6FED"/>
  <polygon points="330,258 350,270 330,282" fill="#FFFFFF"/>
  <text x="320" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2430">Video explicativo</text>
  <text x="320" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6B7280">Explica un concepto o proceso</text>

  <!-- ══════════ CARD 2 · Video tutorial (x=590,y=140) ══════════ -->
  <g filter="url(#cardShadow)">
    <rect x="590" y="140" width="420" height="340" rx="18" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="2"/>
  </g>
  <circle cx="800" cy="270" r="60" fill="url(#iconBg)"/>
  <!-- icono pantalla + cursor con pasos -->
  <rect x="762" y="240" width="76" height="52" rx="6" fill="#2F6FED"/>
  <rect x="770" y="248" width="60" height="36" rx="3" fill="#FFFFFF"/>
  <circle cx="784" cy="266" r="3" fill="#2F6FED"/>
  <circle cx="800" cy="266" r="3" fill="#2F6FED"/>
  <circle cx="816" cy="266" r="3" fill="#2F6FED"/>
  <polygon points="822,278 834,286 822,296" fill="#2F6FED"/>
  <text x="800" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2430">Video tutorial</text>
  <text x="800" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6B7280">Guía un procedimiento paso a paso</text>

  <!-- ══════════ CARD 3 · Infografía (x=1070,y=140) ══════════ -->
  <g filter="url(#cardShadow)">
    <rect x="1070" y="140" width="420" height="340" rx="18" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="2"/>
  </g>
  <circle cx="1280" cy="270" r="60" fill="url(#iconBg)"/>
  <!-- icono infografia: barras + donut -->
  <rect x="1246" y="270" width="14" height="34" fill="#2F6FED"/>
  <rect x="1266" y="254" width="14" height="50" fill="#2F6FED"/>
  <rect x="1286" y="240" width="14" height="64" fill="#2F6FED"/>
  <circle cx="1315" cy="255" r="14" fill="none" stroke="#2F6FED" stroke-width="6"/>
  <text x="1280" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2430">Infografía</text>
  <text x="1280" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6B7280">Sintetiza información clave</text>

  <!-- ══════════ CARD 4 · Presentación multimedia (x=350,y=560) ══════════ -->
  <g filter="url(#cardShadow)">
    <rect x="350" y="560" width="420" height="340" rx="18" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="2"/>
  </g>
  <circle cx="560" cy="690" r="60" fill="url(#iconBg)"/>
  <!-- icono diapositivas -->
  <rect x="525" y="678" width="56" height="40" rx="4" fill="#DCEAFF" stroke="#2F6FED" stroke-width="3"/>
  <rect x="517" y="670" width="56" height="40" rx="4" fill="#FFFFFF" stroke="#2F6FED" stroke-width="3"/>
  <polygon points="537,682 537,698 552,690" fill="#2F6FED"/>
  <text x="560" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2430">Presentación multimedia</text>
  <text x="560" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6B7280">Organiza una secuencia progresiva</text>

  <!-- ══════════ CARD 5 · PDF con diseño (x=830,y=560) ══════════ -->
  <g filter="url(#cardShadow)">
    <rect x="830" y="560" width="420" height="340" rx="18" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="2"/>
  </g>
  <circle cx="1040" cy="690" r="60" fill="url(#iconBg)"/>
  <!-- icono documento PDF -->
  <path d="M1013 654 h38 l14 14 v56 h-52 z" fill="#FFFFFF" stroke="#2F6FED" stroke-width="3"/>
  <path d="M1051 654 v14 h14 z" fill="#DCEAFF" stroke="#2F6FED" stroke-width="3"/>
  <line x1="1021" y1="690" x2="1055" y2="690" stroke="#2F6FED" stroke-width="3"/>
  <line x1="1021" y1="702" x2="1055" y2="702" stroke="#2F6FED" stroke-width="3"/>
  <line x1="1021" y1="714" x2="1044" y2="714" stroke="#2F6FED" stroke-width="3"/>
  <text x="1040" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2430">PDF con diseño</text>
  <text x="1040" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6B7280">Entrega un material de consulta</text>

  <!-- Pie -->
  <text x="800" y="965" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9AA3AF">Haz clic en cada punto de información para explorar el recurso</text>
</svg>
